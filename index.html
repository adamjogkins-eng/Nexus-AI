:root{
  --bg:#070813;
  --surface:#101223;
  --surface2:#171a33;
  --line:rgba(255,255,255,.11);
  --text:#f5f6ff;
  --muted:#a6a9c3;
  --violet:#8b5cf6;
  --cyan:#22d3ee;
  --lime:#a3e635;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Space Grotesk",system-ui,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:inherit
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(900px 500px at 10% -5%,rgba(139,92,246,.25),transparent 55%),radial-gradient(800px 500px at 90% 0,rgba(34,211,238,.18),transparent 50%),var(--bg);
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  border-bottom:1px solid var(--line);
  background:rgba(7,8,19,.86);
  backdrop-filter:blur(18px)
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  text-decoration:none
}

.brand b{
  display:block;
  font-size:18px;
  letter-spacing:.04em
}

.brand small{
  color:var(--muted);
  font-size:11px
}

.logo{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--violet),var(--cyan),var(--lime));
  color:#07101d;
  font-size:21px;
  font-weight:800
}

nav{
  display:flex;
  gap:4px
}

nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 13px;
  border-radius:99px;
  font-weight:600
}

nav button.active,nav button:hover{
  color:white;
  background:rgba(255,255,255,.09)
}

.header-actions{
  display:flex;
  gap:10px;
  align-items:center
}

.demo-pill{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line);
  border-radius:99px;
  padding:7px 10px;
  font-size:12px;
  color:var(--muted)
}

.demo-pill i{
  color:var(--lime);
  font-style:normal
}

.sign{
  border:0;
  border-radius:99px;
  padding:10px 16px;
  background:white;
  color:#111;
  font-weight:700
}

.auth-pill{
  border:1px solid var(--line);
  border-radius:99px;
  padding:8px 11px;
  font-size:12px;
  color:var(--muted);
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.sign.ghost{
  background:transparent;
  color:white;
  border:1px solid var(--line)
}

.sign:disabled{
  opacity:.45
}

.auth-banner{
  display:flex;
  align-items:center;
  gap:10px;
  max-width:1280px;
  margin:12px auto 0;
  padding:12px 16px;
  background:rgba(248,113,113,.12);
  border:1px solid rgba(248,113,113,.35);
  border-radius:12px;
  font-size:13px
}

.auth-banner span{
  flex:1
}

.auth-banner button{
  border:0;
  background:white;
  color:#111;
  border-radius:99px;
  padding:7px 12px;
  font-weight:700
}

.puter-note{
  margin-top:18px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 15px;
  background:rgba(255,255,255,.05);
  display:flex;
  flex-direction:column;
  gap:4px
}

.puter-note b{
  font-size:13px;
  letter-spacing:.08em
}

.puter-note span{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.connection-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 13px;
  margin-bottom:12px;
  font-size:13px;
  color:var(--muted)
}

.connection-row span{
  flex:1
}

.connection-row button{
  border:0;
  border-radius:99px;
  background:white;
  color:#111;
  padding:8px 13px;
  font-weight:700
}

.connection-row .ghost-btn{
  background:transparent;
  color:white;
  border:1px solid var(--line)
}

.connection-row button:disabled{
  opacity:.45
}

.test-result{
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 13px;
  margin-bottom:12px;
  font-size:13px;
  line-height:1.5;
  word-break:break-word
}

.chat-error{
  border:1px solid rgba(248,113,113,.4);
  background:rgba(248,113,113,.1);
  border-radius:12px;
  padding:11px 13px;
  margin-bottom:12px;
  font-size:13px;
  line-height:1.5;
  word-break:break-word
}

.error-notice{
  border-color:rgba(248,113,113,.4)!important;
  background:rgba(248,113,113,.1)!important
}

.image-holder:empty{
  display:none
}

.image-holder img{
  width:100%;
  height:100%;
  -o-object-fit:cover;
     object-fit:cover;
  display:block
}

main{
  max-width:1280px;
  margin:auto;
  padding:0 28px 40px
}

.hero{
  min-height:620px;
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:38px;
  align-items:center;
  padding:54px 0 42px
}

.eyebrow{
  font-size:12px;
  letter-spacing:.18em;
  color:var(--cyan);
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:700
}

.hero h1{
  font-size:clamp(48px,6vw,76px);
  line-height:.92;
  letter-spacing:-.055em;
  margin:18px 0
}

.hero h1 span{
  background:linear-gradient(90deg,var(--violet),var(--cyan),var(--lime));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.hero-copy>p{
  color:var(--muted);
  font-size:18px;
  line-height:1.6;
  max-width:620px
}

.search{
  height:54px;
  margin-top:26px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px
}

.search input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:white
}

.search button{
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,var(--violet),var(--cyan));
  color:white;
  padding:9px 12px;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:700;
  white-space:nowrap
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px
}

.chip{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  padding:8px 12px;
  border-radius:99px
}

.chip.on{
  background:white;
  color:#111
}

.stats{
  display:flex;
  gap:34px;
  margin-top:34px
}

.stats div{
  display:flex;
  flex-direction:column
}

.stats b{
  font-size:26px
}

.stats span{
  color:var(--muted);
  font-size:12px
}

.hero-visual{
  height:520px;
  position:relative;
  border:1px solid var(--line);
  border-radius:28px;
  overflow:hidden;
  background:radial-gradient(circle at 50% 30%,rgba(139,92,246,.35),transparent 45%),linear-gradient(145deg,#141635,#0b1029)
}

.orbit{
  position:absolute;
  border:1px dashed rgba(255,255,255,.18);
  border-radius:50%
}

.o1{
  width:430px;
  height:430px;
  left:-80px;
  top:30px
}

.o2{
  width:330px;
  height:330px;
  right:-60px;
  bottom:20px
}

.hero-card{
  position:absolute;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(10,12,30,.88);
  border:1px solid var(--line);
  border-radius:14px;

.how>span{

    flex-wrap:wrap
  }

    padding:0 16px 30px

  .section-head{
    align-items:flex-start;
    flex-direction:column;
    gap:8px
  }

    flex-direction:column;

  }

@media(max-width:520px){

    height:auto;

  }

  .model-grid{

  }

  .search button{
    width:100%;
    justify-content:center
  }

  .hero{
    padding-top:28px
  }

  .hero h1{
    font-size:48px
  }

  .chat-panel{
    min-height:600px
  }

  .bubble{
    max-width:96%
  }

  .composer{
    align-items:flex-end
  }

  .send{
    height:46px
  }

  .how{

  }

  .sign{
    padding:9px 11px

  .hero-visual{
    height:380px
  }

  .hc2{
    top:130px
  }
