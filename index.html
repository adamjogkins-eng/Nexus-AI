:root{
  --bg:#070813;
  --surface:#101223;
  --surface2:#171a33;
  --line:rgba(255,255,255,.11);
  --text:#f5f6ff;
  --muted:#a6a9c3;
  --violet:#8b5cf6;
  --cyan:#22d3ee;
  --lime:#a3e635;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Space Grotesk",system-ui,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:inherit
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(900px 500px at 10% -5%,rgba(139,92,246,.25),transparent 55%),radial-gradient(800px 500px at 90% 0,rgba(34,211,238,.18),transparent 50%),var(--bg);
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  border-bottom:1px solid var(--line);
  background:rgba(7,8,19,.86);
  backdrop-filter:blur(18px)
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  text-decoration:none
}

.brand b{
  display:block;
  font-size:18px;
  letter-spacing:.04em
}

.brand small{
  color:var(--muted);
  font-size:11px
}

.logo{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--violet),var(--cyan),var(--lime));
  color:#07101d;
  font-size:21px;
  font-weight:800
}

nav{
  display:flex;
  gap:4px
}

nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 13px;
  border-radius:99px;
  font-weight:600
}

nav button.active,nav button:hover{
  color:white;
  background:rgba(255,255,255,.09)
}

.header-actions{
  display:flex;
  gap:10px;
  align-items:center
}

.demo-pill{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line);
  border-radius:99px;
  padding:7px 10px;
  font-size:12px;
  color:var(--muted)
}

.demo-pill i{
  color:var(--lime);
  font-style:normal
}

.sign{
  border:0;
  border-radius:99px;
  padding:10px 16px;
  background:white;
  color:#111;
  font-weight:700
}

main{
  max-width:1280px;
  margin:auto;
  padding:0 28px 40px
}

.hero{
  min-height:620px;
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:38px;
  align-items:center;
  padding:54px 0 42px
}

.eyebrow{
  font-size:12px;
  letter-spacing:.18em;
  color:var(--cyan);
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:700
}

.hero h1{
  font-size:clamp(48px,6vw,76px);
  line-height:.92;
  letter-spacing:-.055em;
  margin:18px 0
}

.hero h1 span{
  background:linear-gradient(90deg,var(--violet),var(--cyan),var(--lime));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.hero-copy>p{
  color:var(--muted);
  font-size:18px;
  line-height:1.6;
  max-width:620px
}

.search{
  height:54px;
  margin-top:26px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px
}

.search input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:white
}

.search button{
  border:0;
  border-radius:9px;
  background:linear-gradient(90deg,var(--violet),var(--cyan));
  color:white;
  padding:9px 12px;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:700;
  white-space:nowrap
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px
}

.chip{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  padding:8px 12px;
  border-radius:99px
}

.chip.on{
  background:white;
  color:#111
}

.stats{
  display:flex;
  gap:34px;
  margin-top:34px
}

.stats div{
  display:flex;
  flex-direction:column
}

.stats b{
  font-size:26px
}

.stats span{
  color:var(--muted);
  font-size:12px
}

.hero-visual{
  height:520px;
  position:relative;
  border:1px solid var(--line);
  border-radius:28px;
  overflow:hidden;
  background:radial-gradient(circle at 50% 30%,rgba(139,92,246,.35),transparent 45%),linear-gradient(145deg,#141635,#0b1029)
}

.orbit{
  position:absolute;
  border:1px dashed rgba(255,255,255,.18);
  border-radius:50%
}

.o1{
  width:430px;
  height:430px;
  left:-80px;
  top:30px
}

.o2{
  width:330px;
  height:330px;
  right:-60px;
  bottom:20px
}

.hero-card{
  position:absolute;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(10,12,30,.88);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  backdrop-filter:blur(10px);
  box-shadow:0 20px 50px rgba(0,0,0,.3)
}

.hero-card b,.hero-card span{
  display:block
}

.hero-card span{
  color:var(--muted);
  font-size:12px
}

.hero-card em{
  color:var(--lime);
  font-style:normal;
  font-size:10px;
  font-weight:800
}

.hc1{
  left:28px;
  top:56px
}

.hc2{
  right:26px;
  top:148px
}

.hc3{
  left:38px;
  top:260px
}

.hero-meter{
  position:absolute;
  left:24px;
  right:24px;
  bottom:24px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px
}

.hero-meter>span{
  font-weight:700
}

.bars{
  display:flex;
  align-items:end;
  gap:8px;
  height:80px;
  margin:14px 0 8px
}

.bars i{
  flex:1;
  background:linear-gradient(180deg,var(--cyan),var(--violet));
  border-radius:5px 5px 0 0
}

.hero-meter small{
  color:var(--muted)
}

.toast{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:white;
  color:#111;
  padding:11px 16px;
  border-radius:99px;
  font-weight:700;
  box-shadow:0 10px 40px rgba(0,0,0,.4)
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:42px 0 20px
}

.section-head h2{
  font-size:34px;
  letter-spacing:-.03em;
  margin:6px 0 0
}

.section-head>p{
  color:var(--muted)
}

.kicker{
  color:var(--lime);
  font-weight:800;
  letter-spacing:.16em;
  font-size:11px;
  margin:0
}

.model-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.model-card{
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  display:flex;
  flex-direction:column;
  min-height:308px;
  transition:.2s
}

.model-card:hover{
  transform:translateY(-3px);
  border-color:var(--accent)
}

.card-top{
  display:flex;
  gap:10px;
  align-items:center
}

.card-top>div{
  flex:1;
  min-width:0
}

.provider{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em
}

.card-top h3{
  margin:1px 0;
  font-size:18px;
  line-height:1.1
}

.avatar{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:12px;

}

.kind{

  font-weight:800;
  color:var(--accent);
  border:1px solid var(--line);

  border-radius:99px
}

.tagline{
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
  min-height:42px
}

.best{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:10px 0;
  display:flex;
  flex-direction:column
}

.best span{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.12em
}

.best b{
  font-size:14px
}

.strengths{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:12px 0;
  color:#d8daf0;
  font-size:13px
}

.strengths span{
  display:flex;
  gap:7px;
  align-items:center
}

.strengths svg{
  color:var(--lime);
  flex:0 0 auto
}

.meta{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--muted);
  font-size:11px;
  margin-top:auto
}

.meta b{
  margin-left:auto;
  color:white
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:13px
}

.chat-btn{
  flex:1;
  border:0;
  background:white;
  color:#111;
  border-radius:10px;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:800
}

.compare-check{
  flex:1;
  border:1px solid var(--line);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:13px
}

.compare-check.on{
  border-color:var(--lime);
  color:var(--lime)
}

.compare-check input{
  accent-color:var(--lime)
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  color:var(--muted)
}

.empty button{
  border:0;
  background:white;
  color:#111;
  border-radius:99px;
  padding:8px 14px;
  margin-left:8px
}

.playground{
  margin-top:70px
}

.play-status{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:13px
}

.demo-dot,.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--lime)
}

.live-dot{
  background:var(--cyan)
}

.notice{
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(163,230,53,.09);
  border:1px solid rgba(163,230,53,.3);
  border-radius:14px;
  padding:14px;
  margin-bottom:14px
}

.notice div{
  flex:1;
  display:flex;
  flex-direction:column
}

.notice span{
  color:var(--muted);
  font-size:13px
}

.notice button{
  border:0;
  background:white;
  color:#111;
  border-radius:99px;
  padding:9px 14px;
  font-weight:700
}

.play-layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:14px
}

.controls,.chat-panel{
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:20px
}

.controls{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:15px
}

.controls label,.studio-controls label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:7px
}

.controls input,.controls select,.studio-controls input,.studio-controls select,.studio-controls textarea{
  width:100%;
  background:#0a0c1d;
  border:1px solid var(--line);
  border-radius:10px;
  color:white;
  padding:11px;
  outline:0
}

.model-detail{
  display:flex;
  align-items:center;
  gap:10px
}

.model-detail small{
  display:block;
  color:var(--muted);
  font-size:12px;
  line-height:1.3
}

.range-label input{
  padding:0
}

.range-label small{
  font-weight:400;
  color:var(--muted)
}

.range-label span{
  display:flex;
  align-items:center;
  gap:6px;
  color:white
}

.range-label b{
  margin-left:auto
}

.model-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px
}

.model-meta code{
  font-family:"JetBrains Mono",monospace;
  color:var(--cyan)
}

.clear{
  margin-top:auto;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:10px;
  padding:10px;
  display:flex;
  gap:7px;
  justify-content:center;
  align-items:center
}

.chat-panel{
  display:flex;
  flex-direction:column;
  min-height:560px;
  overflow:hidden
}

.chat-stream{
  flex:1;
  overflow:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px
}

.bubble{
  max-width:88%;
  padding:13px 15px;
  border-radius:16px;
  align-self:flex-start;
  background:#1a1d3b;
  border:1px solid var(--line)
}

.bubble.user{
  align-self:flex-end;
  background:#29244d
}

.bubble-model{
  font-size:10px;
  letter-spacing:.12em;
  color:var(--cyan);
  font-weight:800
}

.bubble pre{
  white-space:pre-wrap;
  word-break:break-word;
  font-family:inherit;
  margin:6px 0 0;
  line-height:1.55;
  font-size:14px
}

.bubble button{
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:5px;
  padding:7px 0 0
}

.typing{
  display:flex;
  gap:4px;
  align-items:center;
  color:var(--muted);
  font-size:13px
}

.typing i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--cyan);
  animation:pulse 1s infinite
}

.typing i:nth-child(2){
  animation-delay:.15s
}

.typing i:nth-child(3){
  animation-delay:.3s
}

@keyframes pulse{
  50%{
    opacity:.2
  }
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:0 15px 12px
}

.suggestions button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:99px;
  padding:6px 10px;
  font-size:11px
}

.composer{
  border-top:1px solid var(--line);
  padding:14px;
  display:flex;
  gap:10px
}

.composer textarea{
  flex:1;
  resize:none;
  background:#0a0c1d;
  border:1px solid var(--line);
  border-radius:12px;
  color:white;
  padding:12px;
  outline:0
}

.send{
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,var(--violet),var(--cyan));
  color:white;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:800
}

.send:disabled{
  opacity:.45
}

.chat-foot{
  padding:0 16px 13px;
  color:var(--muted);
  font-size:11px;
  margin:0
}

.chat-foot code{
  color:var(--cyan)
}

.compare-sec{
  margin-top:70px
}

.primary{
  border:0;
  border-radius:10px;
  background:linear-gradient(90deg,var(--violet),var(--cyan));
  color:white;
  padding:11px 15px;
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:800
}

.compare-prompt{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:14px;
  color:white;
  padding:14px;
  resize:vertical
}

.compare-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:14px
}

.compare-col{
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:18px;
  min-height:280px;
  overflow:hidden
}

.compare-col header{
  display:flex;
  gap:10px;
  align-items:center;
  padding:14px;
  border-bottom:1px solid var(--line)
}

.compare-col header div{
  flex:1
}

.compare-col small{
  display:block;
  color:var(--muted)
}

.compare-col header button{
  border:0;
  background:transparent;
  color:var(--muted)
}

.compare-col pre{
  white-space:pre-wrap;
  word-break:break-word;
  font-family:inherit;
  padding:14px;
  margin:0;
  color:#d8daf0;
  line-height:1.55;
  font-size:13px
}

.add-compare{
  border:1px dashed var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:18px;
  min-height:180px
}

.studio{
  margin-top:70px
}

.studio-badge,.code-badge{
  border:1px solid var(--line);
  border-radius:99px;
  padding:8px 12px;
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--muted);
  font-size:12px
}

.studio-layout{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:14px
}

.studio-controls{
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px
}

.wide{
  justify-content:center
}

.image-note{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.studio-result{
  min-height:420px;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#0b0e22
}

.studio-result img{
  width:100%;
  height:100%;
  -o-object-fit:cover;
     object-fit:cover;
  display:block
}

.demo-art{
  height:100%;
  min-height:420px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:36px;
  position:relative;
  overflow:hidden;
  background:radial-gradient(circle at 30% 25%,rgba(139,92,246,.55),transparent 40%),radial-gradient(circle at 75% 70%,rgba(34,211,238,.4),transparent 45%),#111332
}

.art-circle{
  width:150px;
  height:150px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--violet),var(--cyan),var(--lime));
  box-shadow:0 0 80px rgba(34,211,238,.5)
}

.art-lines{
  width:240px;
  margin:28px 0 18px
}

.art-lines i{
  display:block;
  height:9px;
  border-radius:99px;
  background:rgba(255,255,255,.25);
  margin:7px 0
}

.art-lines i:nth-child(2){
  width:75%
}

.art-lines i:nth-child(3){
  width:55%
}

.demo-art b{
  font-size:22px
}

.demo-art span{
  color:var(--muted);
  max-width:500px;
  line-height:1.5;
  margin-top:7px
}

.demo-art small{
  margin-top:22px;
  color:var(--lime);
  letter-spacing:.14em;
  font-size:10px
}

.code-sec{
  margin-top:70px
}

.code-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.snippet{
  background:#0a0c1d;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden
}

.snippet header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--line)
}

.snippet header b{
  flex:1
}

.snippet header span{
  color:var(--muted);
  font-size:12px
}

.snippet header button{
  border:1px solid var(--line);
  background:transparent;
  color:white;
  border-radius:99px;
  padding:6px 10px;
  display:flex;
  gap:5px
}

.snippet pre{
  padding:15px;
  margin:0;
  overflow:auto;
  color:#c7d2fe;
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
  line-height:1.65
}

.how{
  margin-top:14px;
  background:linear-gradient(90deg,rgba(139,92,246,.2),rgba(34,211,238,.12));
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  display:flex;
  gap:18px;
  align-items:center
}

.how h3{
  margin:0 0 7px
}

.how p{
  color:var(--muted);
  line-height:1.6;
  margin:0
}

.how code{
  color:var(--cyan)
}

.how>span{
  flex:0 0 auto;
  text-align:center;
  color:var(--lime);
  font-weight:800;
  font-size:12px;
  line-height:1.4
}

footer{
  margin-top:80px;
  border-top:1px solid var(--line);
  padding:28px 0;
  display:flex;
  gap:26px;
  align-items:center;
  justify-content:space-between
}

footer>div{
  display:flex;
  gap:11px;
  align-items:center
}

footer b,footer small{
  display:block
}

footer small{
  color:var(--muted)
}

footer p{
  max-width:560px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

footer p code{
  color:var(--cyan)
}

footer>span{
  color:var(--muted);
  font-size:12px
}

@media(max-width:900px){
  .topbar{
    padding:0 14px
  }

  .topbar nav{
    display:none
  }

  .hero{
    grid-template-columns:1fr;
    min-height:auto
  }

  .hero-visual{
    height:420px
  }

  .model-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .play-layout,.studio-layout,.compare-grid,.code-grid{
    grid-template-columns:1fr
  }

  .stats{
    gap:18px;
    flex-wrap:wrap
  }

  main{
    padding:0 16px 30px
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column;
    gap:8px
  }

  footer{
    flex-direction:column;
    align-items:flex-start
  }
}

@media(max-width:520px){
  .topbar{
    height:auto;
    min-height:64px;
    flex-wrap:wrap;
    padding-top:8px;
    padding-bottom:8px
  }

  .brand small{
    display:none
  }

  .demo-pill span{
    display:none
  }

  .model-grid{
    grid-template-columns:1fr
  }

  .search{
    height:auto;
    flex-wrap:wrap;
    padding:10px
  }

  .search button{
    width:100%;
    justify-content:center
  }

  .hero{
    padding-top:28px
  }

  .hero h1{
    font-size:48px
  }

  .chat-panel{
    min-height:600px
  }

  .bubble{
    max-width:96%
  }

  .composer{
    align-items:flex-end
  }

  .send{
    height:46px
  }

  .how{
    flex-direction:column;
    align-items:flex-start
  }

  .sign{
    padding:9px 11px
  }

  .hero-visual{
    height:380px
  }

  .hc2{
    top:130px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#070813;
    --text:#f5f6ff
  }
}
