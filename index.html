:root{
  --bg:#f7f8fa;
  --surface:#ffffff;
  --surface2:#eef1f5;
  --line:#e2e6ec;
  --text:#111418;
  --muted:#5f6b7a;
  --accent:#2563eb;
  --accent-ink:#ffffff;
  --danger:#b42318;
  --code-bg:#111418;
  --code-text:#eef2ff;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
  line-height:1.5
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer;
  min-height:44px
}

a{
  color:var(--accent)
}

input,select,textarea{
  color:var(--text)
}

input::-moz-placeholder, textarea::-moz-placeholder{
  color:var(--muted)
}

input::placeholder,textarea::placeholder{
  color:var(--muted)
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:var(--bg);
  overflow-x:clip;
  display:flex;
  flex-direction:column
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 20px;
  border-bottom:1px solid var(--line);
  background:var(--surface)
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:var(--text)
}

.brand b{
  display:block;
  font-size:17px
}

.brand small{
  color:var(--muted);
  font-size:11px
}

.logo{
  width:34px;
  height:34px;
  border-radius:8px;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:var(--accent-ink);
  font-size:19px;
  font-weight:700
}

.top-nav{
  display:flex;
  gap:4px
}

.top-nav button,.bottom-nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 13px;
  border-radius:8px;
  font-weight:600;
  min-height:44px
}

.top-nav button.active,.bottom-nav button.active{
  color:var(--accent);
  background:var(--surface2)
}

.header-actions{
  display:flex;
  gap:8px;
  align-items:center
}

.sign{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:600
}

.auth-pill{
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  color:var(--muted);
  max-width:200px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.sign.ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line)
}

.sign:disabled{
  opacity:.45
}

.auth-banner{
  display:flex;
  align-items:center;
  gap:10px;
  max-width:1100px;
  margin:12px auto 0;
  padding:12px 14px;
  background:#fef3f2;
  border:1px solid #fecdca;
  border-radius:8px;
  font-size:13px;
  color:var(--text)
}

.auth-banner span{
  flex:1
}

.auth-banner button{
  border:0;
  background:var(--text);
  color:var(--surface);
  border-radius:8px;
  padding:8px 12px;
  font-weight:600
}

.puter-note{
  margin-top:14px;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  max-width:720px
}

.connection-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  margin:12px 0;
  font-size:13px;
  color:var(--muted)
}

.connection-row span{
  flex:1
}

.connection-row button{
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:var(--accent-ink);
  padding:8px 12px;
  font-weight:600
}

.connection-row .ghost-btn{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line)
}

.connection-row button:disabled{
  opacity:.45
}

.test-result{
  border:1px solid var(--line);
  border-radius:8px;
  padding:11px 13px;
  margin-bottom:12px;
  font-size:13px;
  line-height:1.5;
  word-break:break-word;
  background:var(--surface)
}

.chat-error{
  border:1px solid #fecdca;
  background:#fef3f2;
  border-radius:8px;
  padding:11px 13px;
  margin-bottom:12px;
  font-size:13px;
  line-height:1.5;
  word-break:break-word
}

.error-notice{
  border-color:#fecdca!important;
  background:#fef3f2!important
}

main{
  max-width:1100px;
  margin:auto;
  padding:0 20px 40px;
  width:100%;
  flex:1
}

.hero{
  padding:36px 0 20px
}

.hero h1{
  font-size:clamp(36px,5vw,56px);
  line-height:1.05;
  letter-spacing:-.03em;
  margin:0 0 12px
}

.hero h1 span{
  color:var(--accent)
}

.hero>p{
  color:var(--muted);
  font-size:17px;
  line-height:1.6;
  max-width:720px;
  margin:0
}

.search{
  min-height:52px;
  margin-top:20px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface);
  display:flex;
  align-items:center;
  padding:6px 8px 6px 14px;
  gap:10px
}

.search input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  min-width:0
}

.search button{
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:var(--accent-ink);
  padding:10px 12px;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:600;
  white-space:nowrap
}

.chips{
  display:flex;
  gap:8px;
  margin-top:14px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  padding:8px 12px;
  border-radius:99px;
  white-space:nowrap;
  flex:0 0 auto
}

.chip.on{
  background:var(--text);
  color:var(--surface)
}

.toast{
  position:fixed;
  z-index:60;
  left:50%;
  bottom:84px;
  transform:translateX(-50%);
  background:var(--text);
  color:var(--surface);
  padding:11px 16px;
  border-radius:8px;
  font-weight:600;
  white-space:nowrap
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
  margin:32px 0 16px
}

.section-head h2{
  font-size:28px;
  letter-spacing:-.02em;
  margin:6px 0 0
}

.section-head>p{
  color:var(--muted);
  margin:0
}

.kicker{
  color:var(--accent);
  font-weight:700;
  letter-spacing:.12em;
  font-size:11px;
  margin:0
}

.model-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.model-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px;
  display:flex;
  flex-direction:column;
  min-height:260px
}

.card-top{
  display:flex;
  gap:10px;
  align-items:center
}

.card-top>div{
  flex:1;
  min-width:0
}

.provider{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.06em
}

.card-top h3{
  margin:1px 0;
  font-size:17px;
  line-height:1.15
}

.avatar{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:8px;
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:12px;
  background:var(--surface2);
  color:var(--accent)
}

.kind{
  font-size:10px;
  font-weight:700;
  color:var(--accent);
  border:1px solid var(--line);
  padding:4px 5px;
  border-radius:99px
}

.tagline{
  color:var(--muted);
  font-size:14px;
  line-height:1.45
}

.best{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:10px 0;
  display:flex;
  flex-direction:column
}

.best span{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.1em
}

.best b{
  font-size:14px
}

.strengths{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:12px 0;
  font-size:13px
}

.strengths span{
  display:flex;
  gap:7px;
  align-items:center
}

.strengths svg{
  color:var(--accent);
  flex:0 0 auto
}

.meta{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:11px;
  margin-top:auto;
  flex-wrap:wrap
}

.meta b{
  margin-left:auto;
  color:var(--text)
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:12px
}

.chat-btn{
  flex:1;
  border:0;
  background:var(--accent);
  color:var(--accent-ink);
  border-radius:8px;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:600
}

.compare-check{
  flex:1;
  border:1px solid var(--line);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:13px;
  background:var(--surface)
}

.compare-check.on{
  border-color:var(--accent);
  color:var(--accent)
}

.compare-check input{
  accent-color:var(--accent)
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  color:var(--muted)
}

.empty button{
  border:0;
  background:var(--accent);
  color:var(--accent-ink);
  border-radius:8px;
  padding:8px 14px;
  margin-left:8px
}

.playground{
  padding-top:24px
}

.play-status{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:13px;
  margin-bottom:4px
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent)
}

.notice{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px;
  margin-bottom:12px
}

.notice div{
  flex:1;
  display:flex;
  flex-direction:column
}

.notice span{
  color:var(--muted);
  font-size:13px
}

.notice button{
  border:0;
  background:var(--accent);
  color:var(--accent-ink);
  border-radius:8px;
  padding:9px 14px;
  font-weight:600
}

.model-chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 0 10px;
  scrollbar-width:none
}

.model-chip{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  border-radius:99px;
  padding:8px 12px;
  white-space:nowrap
}

.model-chip.on{
  background:var(--text);
  color:var(--surface);
  border-color:var(--text)
}

.settings-toggle{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:8px;
  padding:10px 12px;
  width:100%;
  text-align:left;
  margin-bottom:10px
}

.controls,.chat-panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px
}

.controls{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:12px
}

.controls label{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:7px
}

.controls input,.controls select,.controls textarea{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  padding:11px;
  outline:0
}

.range-label input{
  padding:0
}

.range-label small{
  font-weight:400;
  color:var(--muted)
}

.range-label span{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--text)
}

.range-label b{
  margin-left:auto
}

.model-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px
}

.model-meta code{
  font-family:"JetBrains Mono",monospace;
  color:var(--accent)
}

.clear{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  border-radius:8px;
  padding:10px 12px;
  display:flex;
  gap:7px;
  justify-content:center;
  align-items:center
}

.chat-head-actions{
  display:flex;
  gap:8px
}

.canvas-btn{
  border:0;
  background:var(--accent);
  color:var(--accent-ink);
  border-radius:8px;
  padding:10px 13px;
  display:flex;
  gap:7px;
  align-items:center;
  font-weight:600
}

.chat-panel{
  display:flex;
  flex-direction:column;
  min-height:560px;
  overflow:hidden
}

.chat-stream{
  flex:1;
  overflow:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px
}

.bubble{
  max-width:92%;
  padding:13px 15px;
  border-radius:8px;
  align-self:flex-start;
  background:var(--surface2);
  border:1px solid var(--line);
  overflow-wrap:anywhere
}

.bubble.user{
  align-self:flex-end;
  background:var(--surface);
  border-color:var(--line)
}

.bubble-model{
  font-size:10px;
  letter-spacing:.1em;
  color:var(--accent);
  font-weight:700
}

.user-text{
  white-space:pre-wrap;
  word-break:break-word;
  margin:6px 0 0;
  line-height:1.55
}

.md{
  font-size:14px;
  line-height:1.6;
  overflow-wrap:anywhere
}

.md p{
  margin:8px 0
}

.md h2,.md h3,.md h4{
  margin:16px 0 6px;
  line-height:1.25
}

.md h2{
  font-size:22px
}

.md h3{
  font-size:18px
}

.md h4{
  font-size:16px
}

.md ul,.md ol{
  margin:8px 0;
  padding-left:22px
}

.md li{
  margin:4px 0
}

.md blockquote{
  border-left:3px solid var(--line);
  margin:10px 0;
  padding:4px 0 4px 12px;
  color:var(--muted)
}

.md hr{
  border:0;
  border-top:1px solid var(--line);
  margin:16px 0
}

.md code{
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
  background:var(--surface2);
  padding:2px 5px;
  border-radius:4px
}

.md a{
  overflow-wrap:anywhere
}

.table-wrap{
  overflow-x:auto;
  margin:10px 0
}

.md table{
  border-collapse:collapse;
  width:100%;
  font-size:13px
}

.md th,.md td{
  border:1px solid var(--line);
  padding:8px;
  text-align:left
}

.md th{
  background:var(--surface2)
}

.code-block{
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  margin:10px 0;
  background:var(--code-bg)
}

.code-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 10px;
  background:#1b1f27;
  color:#cbd2dd;
  font-size:12px
}

.code-head>div{
  display:flex;
  gap:6px
}

.code-head button{
  border:1px solid #3a4150;
  background:transparent;
  color:#e5e9f0;
  border-radius:6px;
  padding:6px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:32px
}

.code-block pre{
  margin:0;
  padding:12px;
  overflow:auto
}

.code-block pre code{
  background:transparent;
  color:var(--code-text);
  padding:0;
  font-size:12px;
  line-height:1.6
}

.artifact-card{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:8px;
  padding:12px;
  margin-top:12px
}

.artifact-card b,.artifact-card span{
  display:block
}

.artifact-card span{
  color:var(--muted);
  font-size:12px
}

.artifact-card button,.msg-actions button{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:8px;
  padding:8px 10px;
  display:inline-flex;
  align-items:center;
  gap:5px
}

.msg-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px
}

.msg-actions button{
  border:0;
  color:var(--muted);
  padding:6px 0;
  background:transparent
}

.typing{
  display:flex;
  gap:4px;
  align-items:center;
  color:var(--muted);
  font-size:13px
}

.typing i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 1s infinite
}

.typing i:nth-child(2){
  animation-delay:.15s
}

.typing i:nth-child(3){
  animation-delay:.3s
}

@keyframes pulse{
  50%{
    opacity:.2
  }
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:0 14px 12px
}

.suggestions button{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  border-radius:99px;
  padding:7px 10px;
  font-size:12px
}

.composer{
  border-top:1px solid var(--line);
  padding:12px;
  display:flex;
  gap:10px;
  position:sticky;
  bottom:0;
  background:var(--surface)
}

.composer textarea{
  flex:1;
  resize:none;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px;
  outline:0;
  min-width:0
}

.send{
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:var(--accent-ink);
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:600
}

.send:disabled{
  opacity:.45
}

.chat-foot{
  padding:0 16px 12px;
  color:var(--muted);
  font-size:11px;
  margin:0
}

.chat-foot code{
  color:var(--accent)
}

.compare-sec{
  padding-top:24px
}

.primary{
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:var(--accent-ink);
  padding:11px 15px;
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:600
}

.compare-prompt{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px;
  resize:vertical
}

.compare-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:12px
}

.compare-col{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  min-height:260px;
  overflow:hidden;
  padding:0 14px 14px
}

.compare-col header{
  display:flex;
  gap:10px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--line)
}

.compare-col header div{
  flex:1
}

.compare-col small{
  display:block;
  color:var(--muted)
}

.compare-col header button{
  border:0;
  background:transparent;
  color:var(--muted);
  min-height:44px;
  min-width:44px
}

.note{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.add-compare{
  border:1px dashed var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:8px;
  min-height:160px
}

.code-sec{
  padding-top:24px
}

.code-badge{
  border:1px solid var(--line);
  border-radius:99px;
  padding:8px 12px;
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--muted);
  font-size:12px
}

.code-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.snippet{
  background:var(--code-bg);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden
}

.snippet header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid #2a2f38;
  color:#e5e9f0
}

.snippet header b{
  flex:1
}

.snippet header span{
  color:#aab2bf;
  font-size:12px
}

.snippet header button{
  border:1px solid #3a4150;
  background:transparent;
  color:#e5e9f0;
  border-radius:8px;
  padding:6px 10px;
  display:flex;
  gap:5px;
  min-height:36px
}

.snippet pre{
  padding:14px;
  margin:0;
  overflow:auto;
  color:#dbe4ff;
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
  line-height:1.65
}

.how{
  margin-top:12px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:18px;
  display:flex;
  gap:18px;
  align-items:center
}

.how h3{
  margin:0 0 7px
}

.how p{
  color:var(--muted);
  line-height:1.6;
  margin:0
}

.how code{
  color:var(--accent)
}

.how>span{
  flex:0 0 auto;
  text-align:center;
  color:var(--accent);
  font-weight:700;
  font-size:12px;
  line-height:1.4
}

footer{
  margin-top:56px;
  border-top:1px solid var(--line);
  padding:24px 0;
  display:flex;
  gap:20px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

footer>div{
  display:flex;
  gap:11px;
  align-items:center
}

footer b,footer small{
  display:block
}

footer small{
  color:var(--muted)
}

footer p{
  max-width:560px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

footer p code{
  color:var(--accent)
}

footer>span{
  color:var(--muted);
  font-size:12px
}

.bottom-nav{
  display:none
}

.canvas-overlay{
  position:fixed;
  inset:0;
  z-index:80;
  background:var(--surface);
  display:flex;
  flex-direction:column;
  padding-top:var(--safe-area-inset-top)
}

.canvas-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap
}

.canvas-head>b{
  flex:1
}

.canvas-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.canvas-tools button,.canvas-close{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:8px;
  padding:9px 11px;
  display:inline-flex;
  align-items:center;
  gap:6px
}

.canvas-tools .close-btn,.canvas-close{
  background:var(--text);
  color:var(--surface);
  border-color:var(--text)
}

.canvas-note{
  padding:10px 14px;
  color:var(--muted);
  margin:0
}

.canvas-frame{
  flex:1;
  width:100%;
  border:0;
  background:white
}

@media(max-width:900px){
  .topbar{
    padding:8px 14px
  }

  .top-nav{
    display:none
  }

  .model-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .compare-grid,.code-grid{
    grid-template-columns:1fr
  }

  .main,main{
    padding:0 16px 30px
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column;
    gap:8px
  }

  footer{
    flex-direction:column;
    align-items:flex-start
  }

  .bottom-nav{
    display:flex;
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:40;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px))
  }

  .bottom-nav button{
    flex:1
  }

  .app-shell{
    padding-bottom:64px
  }

  .composer{
    bottom:64px
  }

  .toast{
    bottom:130px
  }
}

@media(max-width:520px){
  .topbar{
    flex-wrap:wrap
  }

  .brand small{
    display:none
  }

  .auth-pill{
    display:none
  }

  .model-grid{
    grid-template-columns:1fr
  }

  .search{
    flex-wrap:wrap
  }

  .search button{
    width:100%;
    justify-content:center
  }

  .hero{
    padding-top:24px
  }

  .hero h1{
    font-size:38px
  }

  .chat-panel{
    min-height:560px
  }

  .bubble{
    max-width:96%
  }

  .composer{
    align-items:flex-end;
    flex-direction:column
  }

  .composer textarea{
    width:100%
  }

  .send{
    width:100%;
    justify-content:center;
    height:48px
  }

  .how{
    flex-direction:column;
    align-items:flex-start
  }

  .sign{
    padding:9px 11px
  }

  .canvas-head{
    flex-direction:column;
    align-items:stretch
  }

  .canvas-head>b{
    display:none
  }

  .canvas-tools{
    width:100%
  }

  .canvas-tools button{
    flex:1;
    justify-content:center
  }

  .artifact-card{
    flex-direction:column;
    align-items:stretch
  }

  .artifact-card button{
    justify-content:center
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1115;
    --surface:#171a20;
    --surface2:#1f232b;
    --line:#2a2f38;
    --text:#f2f4f7;
    --muted:#aab2bf;
    --accent:#5b8cff;
    --accent-ink:#0b1220;
    --code-bg:#0c0e12
  }

  .auth-banner{
    background:#2a1512;
    border-color:#5a2a26
  }

  .chat-error{
    background:#2a1512;
    border-color:#5a2a26
  }

  .canvas-frame{
    background:white
  }
